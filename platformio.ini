; Each environment is one board. Pins are set with build flags, see src/include/config.h.
; PRESSURE_ADC_CHANNEL is an ADC1 channel: on the ESP32-S3 channel N is GPIO N+1,
; on the ESP32-C6 channel N is GPIO N.

[platformio]
default_envs = esp32-s3-n16r8

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board_build.filesystem = spiffs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:esp32-s3-n16r8]
; ESP32-S3-DevKitC-1 style boards with 16MB flash and 8MB octal PSRAM.
; GPIO 35-37 are used by the PSRAM.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig/defaults;sdkconfig/flash_16mb
board_build.partitions = partitions_8mb.csv
build_flags =
    -D PRESSURE_ADC_CHANNEL=ADC_CHANNEL_8 ; GPIO 9
    -D LED_GPIO=48 ; onboard RGB LED, some board revisions use 38
    -D LED_TYPE=LED_TYPE_WS2812

[env:xiao-esp32s3]
; Seeed Studio XIAO ESP32-S3, 8MB flash
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig/defaults;sdkconfig/flash_8mb
board_build.partitions = partitions_8mb.csv
build_flags =
    -D PRESSURE_ADC_CHANNEL=ADC_CHANNEL_0 ; GPIO 1, labelled D0
    -D LED_GPIO=21
    -D LED_TYPE=LED_TYPE_MONO

[env:xiao-esp32c6]
; Seeed Studio XIAO ESP32-C6, 4MB flash. Too small to host the UI.
board = esp32-c6-devkitm-1
board_upload.flash_size = 4MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig/defaults;sdkconfig/flash_4mb
board_build.partitions = partitions_4mb.csv
build_flags =
    -D PRESSURE_ADC_CHANNEL=ADC_CHANNEL_0 ; GPIO 0, labelled D0
    -D LED_GPIO=15
    -D LED_TYPE=LED_TYPE_MONO
