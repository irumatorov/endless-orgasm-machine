# Publishes the UI to GitHub Pages. Enable it under Settings > Pages > Source: GitHub Actions.
name: UI
on:
  push:
    branches: [main]
    paths: [eomui/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: eomui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: eomui/dist
      - id: deployment
        uses: actions/deploy-pages@v4
